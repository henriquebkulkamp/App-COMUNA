[alembic]
# %(here)s = diretório deste .ini (backend/), independente do cwd de onde
# `alembic` for chamado — deixa `alembic -c backend/alembic.ini ...` funcionar
# mesmo executado a partir da raiz do repo.
script_location = %(here)s/alembic
prepend_sys_path = %(here)s

# sqlalchemy.url é lido de app/config.py (via alembic/env.py) a partir
# de backend/.env — não fica duplicado aqui.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
