services:
  postgres:
    image: postgres:16-alpine
    container_name: comuna-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-comuna}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env.local}
      POSTGRES_DB: ${POSTGRES_DB:-comuna}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - comuna_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-comuna} -d ${POSTGRES_DB:-comuna}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  comuna_pgdata:
