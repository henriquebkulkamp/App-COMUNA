name: Lighthouse CI

# Roda em todo push (qualquer branch) e também pode ser disparado manualmente.
on:
  push:
  workflow_dispatch:

jobs:
  lighthouse:
    name: Auditoria Lighthouse
    runs-on: ubuntu-latest
    # Banco de verdade pro pipeline — sem isso, /api/produtos não tem
    # DATABASE_URL e cai fora, e a home some sem catálogo.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: comuna
          POSTGRES_PASSWORD: comuna
          POSTGRES_DB: comuna
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U comuna -d comuna"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://comuna:comuna@localhost:5432/comuna
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Preparar banco de dados (schema + catálogo de demonstração)
        run: |
          node db/migrate.mjs
          node db/seed.mjs

      - name: Build da aplicação
        run: npm run build

      - name: Iniciar servidor Next.js
        run: |
          nohup npm run start > server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/ > /dev/null; then
              echo "Servidor pronto"
              exit 0
            fi
            sleep 1
          done
          echo "Servidor não respondeu a tempo"
          cat server.log
          exit 1

      - name: Rodar Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          # configPath, não inputs soltos: lighthouserc.js já define url,
          # numberOfRuns e throttling — fonte única, mesma usada local via
          # `npm run test:lighthouse`.
          configPath: ./lighthouserc.js
          uploadArtifacts: true
