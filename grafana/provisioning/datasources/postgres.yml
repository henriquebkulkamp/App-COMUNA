# ============================================================
# Datasource provisionado sozinho — Grafana lê perf_logs direto
# do mesmo Postgres do app (ver docker-compose.yml, serviço
# `grafana`, que injeta essas variáveis a partir do .env.local).
# ============================================================
apiVersion: 1

datasources:
  - name: Postgres COMUNA
    uid: postgres_comuna
    type: postgres
    access: proxy
    url: ${POSTGRES_HOST}:5432
    database: ${POSTGRES_DB}
    user: ${POSTGRES_USER}
    isDefault: true
    editable: true
    jsonData:
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
